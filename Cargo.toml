[package]
name = "whois-service"
version = "0.3.0"
edition = "2021"
description = "High-performance WHOIS/RDAP lookup service and library for domains and IP addresses with auto-detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alesiancyber/rust-whois"
keywords = ["whois", "rdap", "domain", "ip", "lookup"]
categories = ["network-programming", "web-programming"]
readme = "README.md"

# Library configuration
[lib]
name = "whois_service"
path = "src/lib.rs"

# Binary configuration  
[[bin]]
name = "whois-service"
path = "src/main.rs"
required-features = ["server"]



# Feature flags
[features]
default = ["server"]
server = ["axum", "tower", "tower-http", "metrics", "metrics-exporter-prometheus", "tracing-subscriber"]
openapi = ["utoipa", "utoipa-swagger-ui"]
# Redis-backed shared cache tier for multi-instance deployments
redis-cache = ["dep:redis"]


[dependencies]
# Core library dependencies
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
config = "0.15"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
psl = "2.1"  # Has embedded PSL data, updated with crate releases
once_cell = "1.19"
moka = { version = "0.12", features = ["future"] }
url = "2.5"
addr = "0.15"  # PSL-aware domain parsing and validation
dateparser = "0.2"  # Comprehensive date/time string parsing
async-trait = "0.1"  # Object-safe async CacheBackend trait

# Performance & reliability improvements
crossbeam-queue = "0.3"  # Lock-free ArrayQueue for buffer pool (only piece of crossbeam we use)
backon = "1.5"  # Retry with exponential backoff
governor = "0.10"  # Token bucket rate limiting for internal protection

# Metrics dependencies (API only)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true }

# Optional dependencies for server feature
axum = { version = "0.8", features = ["macros", "tracing"], optional = true }
tower = { version = "0.5", features = ["timeout", "limit"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Optional OpenAPI dependencies
utoipa = { version = "5.0", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }

# Optional Redis cache backend (redis-cache feature)
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"], optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio-test = "0.4" 
